aid: li-industries
name: Li Industries
description: 'Li Industries is a critical battery materials company developing next-generation
  lithium-ion battery recycling and closed-loop materials production technology. Its patented
  direct recycling process separates and purifies electrode components from spent lithium-ion
  batteries — including lithium iron phosphate (LFP) chemistries — to produce commercial-grade
  cathode active material without the environmental cost and poor economics of conventional
  smelting or hydrometallurgical routes. The company serves battery manufacturers, cathode
  producers, recyclers and battery collection operations, and in 2024 was selected for a $55
  million U.S. Department of Energy award under the Bipartisan Infrastructure Law to advance
  closed-loop LFP recycling and manufacturing. Li Industries is headquartered in Pineville,
  North Carolina, with an engineering center in Charlotte, North Carolina and an R&D center in
  Blacksburg, Virginia. It is a materials and manufacturing company: it ships physical battery
  material, not software, and publishes no public API, SDK or developer program.'
